<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rozgar Voice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
:root{--navy:#071226;--navy2:#0d1d3a;--amber:#ffb03b;--o:#f97316;--o2:#ea580c;--ot:#fff7ed;--ob:#fed7aa;--os:#ffedd5;--ink:#1f2937;--mute:#6b7280;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;font-family:"Roboto Condensed","Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.55;font-size:16px}
h1,h2,h3,h4{margin:0;line-height:1.2;color:var(--navy)}
.wrap{max-width:1120px;margin:0 auto;padding:0 5%}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);border-bottom:1px solid #1e3358}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:700;font-size:22px;margin-right:auto;cursor:pointer}
.logo b{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--amber);color:var(--navy);font-size:16px}.logo span{color:var(--amber)}
nav{display:flex;gap:18px}nav a{color:#cbd5e1;text-decoration:none;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}nav a:hover,nav a.on{color:var(--amber)}
.btn{display:inline-block;font:inherit;font-weight:700;font-size:15px;border:0;border-radius:10px;padding:10px 20px;background:var(--o);color:#fff;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--o2)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.amber{background:var(--amber);color:var(--navy)}.btn.amber:hover{background:#ffc266}.btn.line{background:#fff;color:var(--o2);border:1px solid var(--ob)}.btn.ghost{background:transparent;color:#fff;border:1px solid #475a7d}.btn.dark{background:var(--navy);color:#fff}
.seg{display:inline-flex;gap:4px;background:var(--navy2);padding:4px;border-radius:10px;border:1px solid #2a4572}
.seg button{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:7px;padding:5px 10px;background:transparent;color:#cbd5e1;cursor:pointer}.seg button.on{background:var(--amber);color:var(--navy)}
#menu{display:none;background:none;border:1px solid #475a7d;color:#fff;border-radius:8px;padding:6px 10px;font-size:18px;cursor:pointer}
#chatBtn{display:flex;align-items:center;gap:8px;padding:8px 14px}#chatBtn i{width:8px;height:8px;border-radius:50%;background:var(--navy);animation:p 1.6s infinite}@keyframes p{50%{opacity:.3}}
@media(max-width:980px){#menu{display:block}nav{display:none;position:absolute;top:64px;left:0;right:0;background:var(--navy);flex-direction:column;padding:14px 5%;gap:14px;border-bottom:1px solid #1e3358}nav.open{display:flex}#chatBtn span{display:none}}
.view{display:none}.view.on{display:block}
.hero{position:relative;background:var(--navy);overflow:hidden}

.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--navy) 0%,var(--navy) 38%,rgba(7,18,38,.55) 62%,rgba(7,18,38,0) 100%)}
@media(max-width:820px){.hero::after{background:linear-gradient(180deg,rgba(7,18,38,.82),rgba(7,18,38,.92))}}
.hero .wrap{position:relative;z-index:1;padding-top:72px;padding-bottom:72px;min-height:560px}
.hero h1{font-size:clamp(52px,9vw,96px);color:#fff;font-weight:800}.hero h1 span{color:var(--amber)}
.tag{font-size:clamp(20px,3vw,30px);font-weight:700;color:#5b8ee0;margin:10px 0 14px}
.lead{font-size:clamp(18px,2.4vw,24px);color:#e2e8f0;max-width:520px;margin:0 0 22px}
.meta{border-top:1px solid #2a4572;padding-top:14px;margin:0 0 24px;font-size:19px;font-weight:700;color:var(--amber);line-height:1.5;list-style:none;padding-left:0}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.chips span{font-size:14px;color:#cbd5e1;border:1px solid #2a4572;background:rgba(13,29,58,.8);border-radius:8px;padding:6px 12px}
section{padding:64px 0}.alt{background:var(--ot)}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.1em;color:var(--o2);text-transform:uppercase}
h2.t{font-size:clamp(28px,4.5vw,42px);margin:6px 0 10px}.sub{color:var(--mute);font-size:17px;max-width:640px;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--ob);border-radius:16px;padding:22px;border-top:4px solid var(--o)}
.card h3{font-size:21px;margin:10px 0 6px}.card p{margin:0;color:var(--mute);font-size:16px}
.num{width:38px;height:38px;border-radius:50%;background:var(--o);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}.ico{font-size:30px}
.stats{background:var(--navy2);padding:34px 0}.stats .grid{text-align:center}.stats b{display:block;font-size:42px;color:var(--amber);font-weight:800}.stats span{color:#cbd5e1}
.band{background:var(--o);color:#fff;text-align:center;padding:56px 0}.band h2{color:#fff;font-size:clamp(28px,4vw,38px)}.band p{margin:10px auto 22px;max-width:600px;font-size:18px}
details{border:1px solid var(--ob);border-radius:12px;padding:14px 18px;margin-bottom:10px;background:#fff}summary{cursor:pointer;font-weight:700;font-size:18px;color:var(--navy)}details p{margin:8px 0 0;color:var(--mute)}
footer{background:var(--navy);color:#cbd5e1;padding:40px 0 22px}
.fg{display:grid;grid-template-columns:2fr 1fr 1fr;gap:28px}@media(max-width:700px){.fg{grid-template-columns:1fr}}
footer h4{color:#fff;margin:0 0 10px;font-size:17px}footer a{display:block;color:#cbd5e1;text-decoration:none;margin-bottom:6px;cursor:pointer}footer a:hover{color:var(--amber)}footer p{margin:0 0 8px;font-size:15px}
.copy{border-top:1px solid #1e3358;margin-top:24px;padding-top:14px;font-size:14px;color:#94a3b8}
/* dashboard */
.hello{background:var(--navy);padding:30px 0 34px}.hello h1{color:#fff;font-size:clamp(30px,5vw,44px)}.hello h1 .am{color:var(--amber)}.hello p{color:#cbd5e1;margin:8px 0 0;max-width:640px}
.dmain{background:var(--ot);padding:24px 0 40px}
.grid2{display:grid;grid-template-columns:7fr 5fr;gap:20px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:20px}
.dc{background:#fff;border:1px solid var(--ob);border-radius:16px;padding:20px;border-top:4px solid var(--o)}
.dc h2{font-size:23px}.dc .sub{font-size:14px;margin:3px 0 0}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}
.pill{display:inline-block;font-size:13px;font-weight:700;color:var(--o2);background:var(--os);border:1px solid var(--ob);border-radius:20px;padding:3px 12px}.pill.ok{background:#fff;color:var(--navy);border-color:var(--amber)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--ob);border-radius:20px;padding:6px 14px;background:#fff;color:var(--ink);cursor:pointer}.chip.on{background:var(--o);border-color:var(--o);color:#fff}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.job{border:1px solid var(--ob);border-radius:14px;padding:14px;background:var(--ot);cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:.15s}
.job:hover,.job:focus{border-color:var(--o);box-shadow:0 4px 14px rgba(249,115,22,.18);outline:none}
.job h3{font-size:19px}.job p{margin:0;font-size:14px;color:var(--mute)}.job strong{color:var(--o2)}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tg{font-size:12px;font-weight:700;padding:2px 9px;border-radius:12px;background:#fff;border:1px solid var(--ob);color:var(--ink)}.tg.have{background:var(--navy);color:#fff;border-color:var(--navy)}
.open{margin-top:auto;font-size:14px;font-weight:700;color:var(--o2)}
.skills{display:flex;gap:8px;flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr 1fr 100px auto;gap:10px}@media(max-width:600px){.form{grid-template-columns:1fr 1fr}}
input{font:inherit;font-size:15px;border:1px solid var(--ob);border-radius:10px;padding:10px;background:#fff;color:var(--ink);min-width:0}input:focus{outline:2px solid var(--o)}
.arch{display:grid;gap:10px}.arch>div{display:flex;gap:12px;align-items:flex-start}
.arch i{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--o);color:#fff;font-style:normal;font-weight:700;font-size:14px}
.arch b{display:block;color:var(--navy)}.arch span{font-size:14px;color:var(--mute)}
/* chat */
#panel{position:fixed;top:calc(72px + env(safe-area-inset-top,0px));right:16px;width:380px;max-width:calc(100vw - 32px);height:min(560px,calc(100vh - 100px));background:#fff;border:1px solid var(--ob);border-radius:18px;box-shadow:0 18px 50px rgba(7,18,38,.3);display:none;flex-direction:column;overflow:hidden;z-index:30}#panel.on{display:flex}
.ph{background:var(--navy);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}.ph b{display:block}.ph small{color:#cbd5e1}
.ph button{margin-left:auto;background:var(--navy2);border:1px solid #2a4572;color:#fff;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px}
#chat{flex:1;overflow-y:auto;background:var(--ot);padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:86%;padding:8px 11px;border-radius:12px;font-size:15px;border:1px solid var(--ob)}.m small{display:block;color:var(--mute);font-size:12px;margin-top:3px}
.me{align-self:flex-end;background:var(--os)}.bot{align-self:flex-start;background:#fff}
.bars{display:inline-flex;gap:2px;align-items:center;height:18px;vertical-align:middle;margin:0 6px}.bars i{width:3px;background:var(--o);border-radius:2px;animation:b 1s infinite ease-in-out}@keyframes b{50%{transform:scaleY(.35)}}
.mic{display:flex;gap:8px;padding:10px;border-top:1px solid var(--ob);align-items:center}.mic div{flex:1;background:var(--ot);border:1px solid var(--ob);border-radius:20px;padding:9px 14px;font-size:14px;color:var(--mute)}
#mic{width:44px;height:44px;border-radius:50%;border:0;background:var(--o);color:#fff;font-size:20px;cursor:pointer}#mic:disabled{opacity:.5}
/* modal */
#ov{position:fixed;inset:0;background:rgba(7,18,38,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}#ov.on{display:flex}
.modal{background:#fff;border-radius:18px;width:100%;max-width:520px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.mh{background:var(--navy);color:#fff;padding:18px 20px 14px;position:relative}.mh small{font-size:12px;letter-spacing:.08em;color:#cbd5e1;font-weight:700}.mh h3{color:#fff;font-size:23px;margin-top:4px;padding-right:40px}
.mh button{position:absolute;top:14px;right:14px;background:var(--navy2);border:1px solid #2a4572;color:#fff;border-radius:8px;width:32px;height:32px;cursor:pointer}
.steps{display:flex;gap:6px;margin-top:12px}.steps i{flex:1;height:4px;border-radius:3px;background:#2a4572}.steps i.on{background:var(--o)}
.mb{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.req{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--ob);border-radius:12px;padding:10px 14px;background:var(--ot)}.req b{color:var(--navy)}
.st{font-size:13px;font-weight:700;border-radius:12px;padding:2px 10px;white-space:nowrap}.st.y{background:var(--navy);color:#fff}.st.n{background:var(--os);color:var(--o2);border:1px solid var(--ob)}
.course{border:1px solid var(--ob);border-radius:14px;padding:14px}.course h4{font-size:19px}.course .sub{font-size:14px;margin:3px 0 0}
.les{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px}.les li{font-size:15px}.les li.d{color:var(--navy);font-weight:700}
.prog{height:8px;background:var(--os);border-radius:6px;overflow:hidden;margin:6px 0 10px}.prog div{height:100%;width:0;background:var(--o);transition:width .4s}
.mf{display:flex;justify-content:space-between;gap:10px;padding:14px 20px;border-top:1px solid var(--ob)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;transition:.3s;background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;max-width:90%;z-index:60;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}#toast b{color:var(--amber)}

  d.onclick=()=>openJob(j);d.onkeydown=e=>{if(e.key==='Enter')openJob(j)};b.append(d)});
 if(!b.children.length)b.textContent=t('noJobs')}
function renderSkills(){const s=$('mySkills');s.innerHTML='';if(!have.size)s.append(el('p','sub',t('noBadge')));
 have.forEach(k=>s.append(el('span','pill','🏅 '+SK[k].n[LI])));$('lvl').textContent=t(have.size>=3?'lvl2':have.size?'lvl1':'lvl0')}
const missing=()=>cur.q.filter(k=>!have.has(k));
function openJob(j){cur=j;step=1;learned=false;$('ov').classList.add('on');renderModal()}
function closeModal(){$('ov').classList.remove('on')}
function renderModal(){if(!cur||!$('ov').classList.contains('on'))return;const mb=$('mb'),mf=$('mf'),ms=$('ms');mb.innerHTML='';mf.innerHTML='';ms.innerHTML='';
 [1,2,3].forEach(n=>ms.append(el('i',n<=step?'on':'')));const miss=missing(),role=tx(cur.r),loc=tx(cur.l);$('mk').textContent=t('mStep')+' '+step+' / 3';
 const wl=role+' · '+loc+' · ₹'+cur.w+t('perDay');
 if(step===1){$('mt').textContent=t('mReq')+' '+role;mb.append(el('p','sub',wl+' · '+t('mEsc')));
  cur.q.forEach(k=>{const r=el('div','req');r.append(el('b',0,SK[k].n[LI]),el('span','st '+(have.has(k)?'y':'n'),t(have.has(k)?'mHave':'mNeed')));mb.append(r)});
  const lb=el('button','btn line',t('mListen'));lb.onclick=()=>speak(wl);mb.append(lb);
  const sk=el('button','btn line',t('mSkip'));sk.onclick=()=>{step=3;renderModal()};const nx=el('button','btn',t(miss.length?'mNextL':'mNext'));nx.onclick=()=>{step=miss.length?2:3;renderModal()};mf.append(sk,nx)}
 else if(step===2){$('mt').textContent=t('mLearn');
  cur.q.filter(k=>!have.has(k)||learned).forEach(k=>{const c=el('div','course'),done=have.has(k);c.append(el('h4',0,SK[k].c[LI]),el('p','sub',t('mCovers')+' '+SK[k].n[LI]+' · '+SK[k].l.length+' '+t('mLes')));
   const ul=el('ul','les');SK[k].l.forEach(x=>ul.append(el('li',done?'d':'',(done?'✔ ':'○ ')+x[LI])));
   const pg=el('div','prog');pg.append(el('div'));pg.firstChild.style.width=done?'100%':'0';const go=el('button','btn',t(done?'mDone':'mStart'));go.disabled=done;go.onclick=()=>runCourse(k,ul,pg.firstChild,go);c.append(ul,pg,go);mb.append(c)});
  const bk=el('button','btn line',t('mBack'));bk.onclick=()=>{step=1;renderModal()};const sk=el('button','btn line',t('mSkip'));sk.onclick=()=>{step=3;renderModal()};
  const nx=el('button','btn',t('mNext'));nx.id='n2';nx.disabled=miss.length>0;nx.onclick=()=>{step=3;renderModal()};mf.append(bk,sk,nx)}
 else{$('mt').textContent=t('mReady');mb.append(el('p',0,wl));
  cur.q.forEach(k=>{const r=el('div','req');r.append(el('b',0,SK[k].n[LI]),el('span','st '+(have.has(k)?'y':'n'),t(have.has(k)?'mBadge':'mLater')));mb.append(r)});
  if(miss.length)mb.append(el('p','sub',t('mNote')));
  const bk=el('button','btn line',t('mBack'));bk.onclick=()=>{step=miss.length?2:1;renderModal()};
  const ap=el('button','btn',t('mApply'));ap.onclick=()=>{closeModal();toast(t('tApplied'),role+' · '+loc);addMsg('bot',{en:T.sent[0]+' '+tx0(cur.r)+' ('+tx0(cur.l)+')',hi:T.sent[1]+' '+cur.r[1]+' ('+cur.l[1]+')',mr:T.sent[2]+' '+cur.r[2]+' ('+cur.l[2]+')'})};mf.append(bk,ap)}}
const tx0=v=>Array.isArray(v)?v[0]:v;
function runCourse(k,ul,bar,btn){btn.disabled=true;btn.textContent=t('mPlay');learned=true;let i=0;const lis=ul.children;
 const iv=setInterval(()=>{lis[i].className='d';lis[i].textContent='✔ '+SK[k].l[i][LI];i++;bar.style.width=Math.round(i/lis.length*100)+'%';
  if(i>=lis.length){clearInterval(iv);have.add(k);btn.textContent=t('mDone');toast(t('mBadge'),SK[k].n[LI]);renderJobs();renderSkills();const n=$('n2');if(n)n.disabled=missing().length>0}},800)}
$('mx').onclick=closeModal;$('ov').onclick=e=>{if(e.target===$('ov'))closeModal()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('panel').classList.remove('on')}});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');filter=c.dataset.t;renderJobs()});
$('post').onclick=()=>{const r=$('er').value.trim()||'Mason helper',l=$('el').value.trim()||'Thane East',w=parseInt($('ew').value,10)||900;
 jobs.unshift({r,l,w,t:'construction',q:['safety']});$('er').value='';$('el').value='';$('ew').value='';filter='all';document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.t==='all'));renderJobs();toast(t('tPosted'),r+' · '+l)};
/* chat */
const steps=[
{u:{mr:'मला ठाण्यात गवंडी काम हवे आहे',hi:'मुझे ठाणे में राजमिस्त्री का काम चाहिए',en:'I need mason work in Thane.'},b:{mr:'तुमच्या जवळ 2 पडताळलेली कामे मिळाली. जॉब यादी पाहा.',hi:'आपके पास 2 सत्यापित काम मिले। जॉब सूची देखें।',en:'2 verified jobs found. See the job list.'}},
{u:{mr:'या कामासाठी काय शिकावे लागेल?',hi:'इस काम के लिए क्या सीखना होगा?',en:'What do I need to learn for this job?'},b:{mr:'सुरक्षा आणि गवंडी कामाचे छोटे कोर्स आहेत. कामावर टॅप करा.',hi:'सुरक्षा और राजमिस्त्री के छोटे कोर्स हैं। काम पर टैप करें।',en:'There are short courses on safety and masonry. Tap the job.'}},
{u:{mr:'काम पूर्ण झाले',hi:'काम पूरा हो गया',en:'The work is finished.'},b:{mr:'₹800 तुमच्या UPI वर पाठवले. मध्यस्थाची कपात नाही.',hi:'₹800 आपके UPI में भेज दिए गए। बीच में कोई कटौती नहीं।',en:'₹800 sent to your UPI. No middleman cut.'}}];
const LK=['en','hi','mr'];let si=0,busy=false,log=[];
function drawMsg(m){const d=el('div','m '+m.c);
 if(m.v){const v=el('div');v.innerHTML='▶<span class="bars">'+[0,1,2,3,4,5,6].map(k=>'<i style="height:'+(6+(k*5)%12)+'px;animation-delay:'+k*.1+'s"></i>').join('')+'</span>0:04';d.append(v)}
 d.append(el('div',0,m.o[LK[LI]]));if(LI>0)d.append(el('small',0,m.o.en));$('chat').append(d)}
function addMsg(c,o,v){const m={c,o,v};log.push(m);drawMsg(m);$('chat').scrollTop=1e5}
function redrawChat(){$('chat').innerHTML='';log.forEach(drawMsg);$('chat').scrollTop=1e5}
$('chatBtn').onclick=()=>$('panel').classList.toggle('on');$('chatX').onclick=()=>$('panel').classList.remove('on');
$('mic').onclick=()=>{if(busy)return;busy=true;$('mic').disabled=true;$('micT').textContent=t('micL');const s=steps[si++%steps.length];
 setTimeout(()=>{addMsg('me',s.u,1);$('micT').textContent=t('micP')},900);
 setTimeout(()=>{addMsg('bot',s.b);$('micT').textContent=t('micIdle');busy=false;$('mic').disabled=false},2200)};
/* language + views */
function applyLang(){document.documentElement.lang=LK[LI];
 document.querySelectorAll('[data-k]').forEach(e=>{e.textContent=t(e.dataset.k)});
 document.querySelectorAll('[data-kp]').forEach(e=>{e.placeholder=t(e.dataset.kp)});
 document.querySelectorAll('#langs button').forEach(b=>b.classList.toggle('on',+b.dataset.l===LI));
 $('micT').textContent=busy?$('micT').textContent:t('micIdle');renderJobs();renderSkills();renderModal();redrawChat()}
document.querySelectorAll('#langs button').forEach(b=>b.onclick=()=>{LI=+b.dataset.l;applyLang();toast(t('tLang'),t('tLangN'))});
function show(){const d=location.hash==='#dashboard';$('v-home').classList.toggle('on',!d);$('v-dash').classList.toggle('on',d);
 document.querySelectorAll('#nav a[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===(d?'dashboard':'home')));window.scrollTo(0,0)}
function go(v,s){const want='#'+v;if(location.hash!==want){location.hash=want}else show();if(s)setTimeout(()=>{const x=$(s);if(x)x.scrollIntoView({behavior:'smooth'})},60)}
document.addEventListener('click',e=>{const a=e.target.closest('[data-v],[data-s]');if(!a)return;e.preventDefault();$('nav').classList.remove('open');
 if(a.dataset.s)go('home',a.dataset.s);else go(a.dataset.v)});
window.addEventListener('hashchange',show);$('menu').onclick=()=>$('nav').classList.toggle('open');
addMsg('bot',{en:T.greet[0],hi:T.greet[1],mr:T.greet[2]});applyLang();show();
</script></body></html>
